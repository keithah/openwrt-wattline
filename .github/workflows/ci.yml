name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Package behavior tests
        run: |
          set -eu
          for test in \
            package/tests/firewall-sync_test.sh \
            package/tests/vpn-firewall-repair_test.sh \
            package/tests/provisioning_test.sh \
            package/tests/luci_contract_test.sh \
            package/tests/gl_contract_test.sh \
            package/tests/gl_nginx_proxy_test.sh \
            package/tests/bluetooth-security-recovery_test.sh \
            package/tests/rtl8761b-retire_test.sh \
            package/tests/feed-migrate-test.sh \
            package/tests/release-readiness_test.sh; do
            sh "$test"
          done
          node package/tests/luci_behavior_test.js
          node package/tests/power_loss_behavior_test.js
      - name: Build product packages
        run: make -C package all
      - name: Release inventory
        run: |
          set -eu
          # The build above uses the Makefile default, so read it rather than
          # pinning a version here that silently drifts on every bump.
          version=$(sed -n 's/^VERSION := //p' package/Makefile)
          sh package/tests/release-inventory_test.sh package/out "$version"
